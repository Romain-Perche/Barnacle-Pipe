<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper: #FAF6F1; --ink: #111827; --muted: rgba(17,24,39,.6);
    --line: rgba(0,0,0,.4); --line-soft: rgba(0,0,0,.1); --line-list: rgba(0,0,0,.08);
    --blue: #2B00FF; --blue-deep: #1A0099; --orange: #FF4200; --danger: #DC2626;
    --panel: #FFFFFF; --page: #EDE7DF; --wash: rgba(43,0,255,.05); --owash: rgba(255,66,0,.07);
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1A1A1A; --ink: #F3F0EB; --muted: rgba(243,240,235,.6);
      --line: rgba(255,255,255,.4); --line-soft: rgba(255,255,255,.1); --line-list: rgba(255,255,255,.08);
      --panel: #232323; --page: #0E0E0E; --wash: rgba(120,100,255,.12); --owash: rgba(255,66,0,.12);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); }
  header.top { padding: 24px 32px 8px; }
  .label { font-family: var(--mono); font-weight: 700; text-transform: uppercase; letter-spacing: .25em; font-size: 11px; color: var(--muted); }
  .c { color: var(--orange); }
  header.top h1 { font-size: 22px; margin: 8px 0 4px; font-weight: 600; }
  header.top p { margin: 0; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(640px, 1fr)); gap: 24px; padding: 24px 32px 40px; overflow-x: auto; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .tag { font-family: var(--mono); font-weight: 700; letter-spacing: .25em; font-size: 12px; text-transform: uppercase; }
  .tag b { background: var(--orange); color: #fff; padding: 2px 8px; margin-right: 8px; letter-spacing: .1em; }
  figcaption { font-size: 14px; line-height: 1.45; }
  .app { display: grid; grid-template-columns: 150px 1fr; min-height: 430px; border: .5px solid var(--line); overflow: hidden; }
  .side { background: var(--blue); color: #fff; display: flex; flex-direction: column; padding: 16px 12px; font-family: var(--mono); }
  .wm { font-weight: 700; letter-spacing: .2em; font-size: 10px; margin-bottom: 22px; }
  .nav span { display: block; color: rgba(255,255,255,.75); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 6px 8px; }
  .nav span.on { color: #fff; background: var(--blue-deep); }
  .grp { margin-top: 18px; font-size: 9px; letter-spacing: .25em; font-weight: 700; color: rgba(255,255,255,.55); padding: 0 8px 4px; }
  .me { margin-top: auto; border-top: .5px solid rgba(255,255,255,.4); padding-top: 10px; font-size: 10px; }
  .me .n { font-family: var(--sans); font-size: 12px; margin-bottom: 4px; }
  .me .so { color: rgba(255,255,255,.75); font-weight: 700; letter-spacing: .1em; }
  .main { background: var(--paper); padding: 18px; }
  .ph { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: .5px solid var(--line); padding-bottom: 10px; margin-bottom: 12px; }
  .ph h2 { margin: 3px 0 0; font-size: 20px; font-weight: 700; }
  .count { font-family: var(--mono); font-size: 9px; letter-spacing: .25em; font-weight: 700; color: var(--muted); }
  .btn { font-family: var(--mono); font-weight: 700; letter-spacing: .1em; font-size: 9px; text-transform: uppercase; border: .5px solid var(--line); padding: 5px 8px; background: transparent; color: var(--ink); white-space: nowrap; display: inline-block; }
  .btn.solid { background: var(--blue); color: #fff; border-color: var(--blue); }
  .br { font-family: var(--mono); font-weight: 700; letter-spacing: .1em; font-size: 9px; text-transform: uppercase; white-space: nowrap; margin-left: 10px; }
  .br.red { color: var(--danger); }
  .input { border: .5px solid var(--line); background: var(--panel); padding: 5px 7px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .sel { border: .5px solid var(--line); background: var(--panel); padding: 5px 7px; font-family: var(--mono); font-size: 10px; color: var(--ink); white-space: nowrap; display: inline-block; }
  .addrow { display: flex; gap: 6px; margin-bottom: 12px; }
  .addrow .input { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th { font-family: var(--mono); font-size: 8px; letter-spacing: .25em; text-transform: uppercase; text-align: left; color: var(--muted); font-weight: 700; padding: 5px; border-bottom: .5px solid var(--line-soft); }
  td { padding: 7px 5px; border-bottom: .5px solid var(--line-list); vertical-align: middle; }
  td .em { display: block; color: var(--muted); font-size: 10px; }
  tr.off td { color: var(--muted); }
  td.acts { text-align: right; white-space: nowrap; }
  .badge { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; font-weight: 700; text-transform: uppercase; border: .5px solid var(--line); padding: 1px 4px; white-space: nowrap; }
  .badge.admin { background: var(--blue); color: #fff; border-color: var(--blue); }
  .badge.off { border-style: dashed; }
  .notice { border-left: 4px solid var(--blue); background: var(--wash); border-radius: 0 8px 8px 0; padding: 8px 10px; font-size: 11px; margin-bottom: 10px; }
  .panel { border-left: 4px solid var(--orange); background: var(--owash); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 12px; margin-bottom: 12px; color: var(--ink); }
  .panel p { margin: 0 0 8px; }
  .panel .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .panel .hint { color: var(--muted); font-size: 10px; margin-top: 6px; }
  tr.expand td { background: var(--owash); color: var(--ink); border-bottom: .5px solid var(--line-soft); }
  .pp { font-family: var(--mono); font-size: 9px; letter-spacing: .05em; color: var(--orange); font-weight: 700; display: block; margin-top: 2px; }
  .k { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <div class="label"><span class="c">//</span> SF-92 · PRIVATE AND DELETED PEOPLE</div>
  <h1>Which design for handing over a deactivated user's private people?</h1>
  <p>Each design shows the Users page. Alan Fake is deactivated and owns 2 private people. The admin hands them to an active user.</p>
</header>
<div class="grid">

<!-- ================= A ================= -->
<figure>
  <div class="tag"><b>A</b> The row opens a hand-over line</div>
  <div class="app">
    <div class="side">
      <div class="wm"><span class="c">✸</span> BARNACLE<span class="c">_</span>LABS</div>
      <div class="nav"><span>Home</span><span>People</span><span>Organisations</span></div>
      <div class="grp"><span class="c">//</span> ADMIN</div>
      <div class="nav"><span class="on">Users</span><span>Lead sources and labels</span></div>
      <div class="me"><div class="n">Ada Fake</div><div class="so">[ SIGN OUT ]</div></div>
    </div>
    <div class="main">
      <div class="ph"><div><div class="label"><span class="c">//</span> ADMIN</div><h2>Users</h2></div><div class="count">5 USERS · 2 ADMINS</div></div>
      <div class="addrow"><span class="input">name@barnacle.ai</span><span class="btn solid">[ ADD USER ]</span></div>
      <table>
        <tr><th>Name</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr>
        <tr><td>Ada Fake<span class="em">ada@barnacle.ai</span></td><td><span class="badge admin">Admin</span></td><td>Active</td><td>19 Nov 2026</td><td class="acts"><span class="br">[ REMOVE ADMIN ]</span></td></tr>
        <tr><td>Linus Fake<span class="em">linus@barnacle.ai</span></td><td><span class="badge">User</span></td><td>Active</td><td>18 Nov 2026</td><td class="acts"><span class="br">[ MAKE ADMIN ]</span><span class="br red">[ DEACTIVATE ]</span></td></tr>
        <tr><td>Margaret Fake<span class="em">margaret@barnacle.ai</span></td><td><span class="badge">User</span></td><td>Active</td><td>17 Nov 2026</td><td class="acts"><span class="br">[ MAKE ADMIN ]</span><span class="br red">[ DEACTIVATE ]</span></td></tr>
        <tr class="off"><td>Alan Fake<span class="em">alan@barnacle.ai</span></td><td><span class="badge">User</span></td><td><span class="badge off">Deactivated</span><span class="pp">2 PRIVATE PEOPLE</span></td><td>2 Oct 2026</td><td class="acts"><span class="br">[ HAND OVER ]</span><span class="br">[ REACTIVATE ]</span></td></tr>
        <tr class="expand"><td colspan="5">Hand Alan Fake's 2 private people to
          <span class="sel">Margaret Fake ▾</span> <span class="btn solid">[ HAND OVER ]</span> <span class="br">[ CANCEL ]</span>
          <div class="k" style="margin-top:5px">They stay private. Their new owner can see them.</div></td></tr>
      </table>
    </div>
  </div>
  <figcaption>Good for: the choice sits on Alan's row, so the admin cannot pick the wrong user; one press hands over.</figcaption>
</figure>

<!-- ================= B ================= -->
<figure>
  <div class="tag"><b>B</b> A panel above the table, then a question</div>
  <div class="app">
    <div class="side">
      <div class="wm"><span class="c">✸</span> BARNACLE<span class="c">_</span>LABS</div>
      <div class="nav"><span>Home</span><span>People</span><span>Organisations</span></div>
      <div class="grp"><span class="c">//</span> ADMIN</div>
      <div class="nav"><span class="on">Users</span><span>Lead sources and labels</span></div>
      <div class="me"><div class="n">Ada Fake</div><div class="so">[ SIGN OUT ]</div></div>
    </div>
    <div class="main">
      <div class="ph"><div><div class="label"><span class="c">//</span> ADMIN</div><h2>Users</h2></div><div class="count">5 USERS · 2 ADMINS</div></div>
      <div class="panel">
        <p><b>Hand Alan Fake's 2 private people to Margaret Fake?</b></p>
        <div class="row"><span class="sel">Margaret Fake ▾</span><span class="btn solid">[ HAND OVER ]</span><span class="br">[ CANCEL ]</span></div>
        <div class="hint">They stay private. Margaret Fake becomes their owner and can see them. You will not see who they are.</div>
      </div>
      <div class="addrow"><span class="input">name@barnacle.ai</span><span class="btn solid">[ ADD USER ]</span></div>
      <table>
        <tr><th>Name</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr>
        <tr><td>Ada Fake<span class="em">ada@barnacle.ai</span></td><td><span class="badge admin">Admin</span></td><td>Active</td><td>19 Nov 2026</td><td class="acts"><span class="br">[ REMOVE ADMIN ]</span></td></tr>
        <tr><td>Linus Fake<span class="em">linus@barnacle.ai</span></td><td><span class="badge">User</span></td><td>Active</td><td>18 Nov 2026</td><td class="acts"><span class="br">[ MAKE ADMIN ]</span><span class="br red">[ DEACTIVATE ]</span></td></tr>
        <tr><td>Margaret Fake<span class="em">margaret@barnacle.ai</span></td><td><span class="badge">User</span></td><td>Active</td><td>17 Nov 2026</td><td class="acts"><span class="br">[ MAKE ADMIN ]</span><span class="br red">[ DEACTIVATE ]</span></td></tr>
        <tr class="off"><td>Alan Fake<span class="em">alan@barnacle.ai</span></td><td><span class="badge">User</span></td><td><span class="badge off">Deactivated</span><span class="pp">2 PRIVATE PEOPLE</span></td><td>2 Oct 2026</td><td class="acts"><span class="br">[ HAND OVER ]</span><span class="br">[ REACTIVATE ]</span></td></tr>
      </table>
    </div>
  </div>
  <figcaption>Good for: same look as the delete confirmation on a person's page; the question names both users before anything changes.</figcaption>
</figure>

<!-- ================= C ================= -->
<figure>
  <div class="tag"><b>C</b> A column with the choice on every row</div>
  <div class="app">
    <div class="side">
      <div class="wm"><span class="c">✸</span> BARNACLE<span class="c">_</span>LABS</div>
      <div class="nav"><span>Home</span><span>People</span><span>Organisations</span></div>
      <div class="grp"><span class="c">//</span> ADMIN</div>
      <div class="nav"><span class="on">Users</span><span>Lead sources and labels</span></div>
      <div class="me"><div class="n">Ada Fake</div><div class="so">[ SIGN OUT ]</div></div>
    </div>
    <div class="main">
      <div class="ph"><div><div class="label"><span class="c">//</span> ADMIN</div><h2>Users</h2></div><div class="count">5 USERS · 2 ADMINS</div></div>
      <div class="notice">2 private people handed to Margaret Fake.</div>
      <div class="addrow"><span class="input">name@barnacle.ai</span><span class="btn solid">[ ADD USER ]</span></div>
      <table>
        <tr><th>Name</th><th>Role</th><th>Status</th><th>Private people</th><th></th></tr>
        <tr><td>Ada Fake<span class="em">ada@barnacle.ai</span></td><td><span class="badge admin">Admin</span></td><td>Active</td><td>—</td><td class="acts"><span class="br">[ REMOVE ADMIN ]</span></td></tr>
        <tr><td>Linus Fake<span class="em">linus@barnacle.ai</span></td><td><span class="badge">User</span></td><td>Active</td><td>—</td><td class="acts"><span class="br">[ MAKE ADMIN ]</span><span class="br red">[ DEACTIVATE ]</span></td></tr>
        <tr><td>Margaret Fake<span class="em">margaret@barnacle.ai</span></td><td><span class="badge">User</span></td><td>Active</td><td>—</td><td class="acts"><span class="br">[ MAKE ADMIN ]</span><span class="br red">[ DEACTIVATE ]</span></td></tr>
        <tr class="off"><td>Alan Fake<span class="em">alan@barnacle.ai</span></td><td><span class="badge">User</span></td><td><span class="badge off">Deactivated</span></td><td style="color:var(--ink)">2 <span class="sel">To… ▾</span> <span class="btn">[ HAND OVER ]</span></td><td class="acts"><span class="br">[ REACTIVATE ]</span></td></tr>
      </table>
      <div class="k" style="margin-top:8px">Shown after the press: the notice above. No separate question.</div>
    </div>
  </div>
  <figcaption>Good for: fastest, with no extra step; but "Last sign-in" moves out and nothing asks before the hand-over.</figcaption>
</figure>

</div>
</body>
</html>
