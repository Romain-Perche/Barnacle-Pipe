<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF-95 · Deal list view and deal page · design options</title>
<style>
  :root {
    --paper: #FAF6F1; --ink: #111827; --muted: rgba(17,24,39,.6);
    --line: rgba(0,0,0,.4); --line-soft: rgba(0,0,0,.1); --line-list: rgba(0,0,0,.08);
    --blue: #2B00FF; --blue-deep: #1A0099; --orange: #FF4200; --danger: #DC2626;
    --wash: rgba(43,0,255,.04); --panel: #FFFFFF; --page: #EDE7DF; --col: rgba(0,0,0,.03);
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1A1A1A; --ink: #F3F0EB; --muted: rgba(243,240,235,.6);
      --line: rgba(255,255,255,.4); --line-soft: rgba(255,255,255,.1); --line-list: rgba(255,255,255,.08);
      --wash: rgba(120,100,255,.10); --panel: #232323; --page: #0E0E0E; --col: rgba(255,255,255,.03);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); }
  header.top { padding: 24px 32px 8px; }
  .label { font-family: var(--mono); font-weight: 700; text-transform: uppercase; letter-spacing: .25em; font-size: 11px; }
  .c { color: var(--orange); }
  h1 { font-size: 22px; margin: 8px 0 4px; font-weight: 600; }
  header.top p { margin: 0; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(640px, 1fr)); gap: 24px; padding: 24px 32px 40px; overflow-x: auto; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .tag { font-family: var(--mono); font-weight: 700; letter-spacing: .25em; font-size: 12px; text-transform: uppercase; }
  .tag b { background: var(--orange); color: #fff; padding: 2px 8px; margin-right: 8px; letter-spacing: .1em; }
  .sub { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); }
  figcaption { font-size: 14px; line-height: 1.45; }
  figcaption .label { display: block; margin-bottom: 4px; color: var(--muted); }

  .app { display: grid; grid-template-columns: 140px 1fr; height: 520px; border: .5px solid var(--line); overflow: hidden; position: relative; }
  .side { background: var(--blue); color: #fff; display: flex; flex-direction: column; padding: 16px 10px; font-family: var(--mono); }
  .wm { font-weight: 700; letter-spacing: .2em; font-size: 9px; margin-bottom: 22px; }
  .nav span { display: block; color: rgba(255,255,255,.75); font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 6px 8px; }
  .nav span.on { color: #fff; background: var(--blue-deep); }
  .grp { margin-top: 18px; font-size: 8px; letter-spacing: .25em; font-weight: 700; color: rgba(255,255,255,.55); padding: 0 8px 4px; }
  .me { margin-top: auto; border-top: .5px solid rgba(255,255,255,.4); padding-top: 10px; font-size: 9px; }
  .me .n { font-family: var(--sans); font-size: 11px; margin-bottom: 4px; }
  .me .so { color: rgba(255,255,255,.75); font-weight: 700; letter-spacing: .1em; }
  .main { background: var(--paper); padding: 16px; overflow: hidden; position: relative; }
  .ph { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: .5px solid var(--line); padding-bottom: 10px; margin-bottom: 12px; gap: 8px; }
  .ph h2 { margin: 3px 0 0; font-size: 20px; font-weight: 700; }
  .btn { font-family: var(--mono); font-weight: 700; letter-spacing: .1em; font-size: 9px; text-transform: uppercase; border: .5px solid var(--line); padding: 5px 8px; color: var(--ink); white-space: nowrap; display: inline-block; }
  .btn.solid { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.red { color: var(--danger); }
  .sel { border: .5px solid var(--line); background: var(--panel); padding: 5px 7px; font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .k { font-family: var(--mono); font-size: 8px; letter-spacing: .25em; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
  .v { font-size: 11px; margin-bottom: 8px; }
  .lk { color: var(--blue); }
  .badge { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; font-weight: 700; text-transform: uppercase; border: .5px solid var(--line); padding: 1px 4px; white-space: nowrap; }
  .warn { font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--orange); }
  .muted { color: var(--muted); }
  .app { height: 600px; }
  .tl { list-style: none; margin: 0; padding: 0; font-size: 10px; }
  .tl li { border-bottom: .5px solid var(--line-list); padding: 5px 0; }
  .tl .when { display: block; font-family: var(--mono); font-size: 8px; color: var(--muted); }
  .sect { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .25em; color: var(--muted); margin: 12px 0 6px; border-top: .5px solid var(--line-soft); padding-top: 8px; }
  .dl { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
  .back { font-family: var(--mono); font-size: 9px; color: var(--blue); letter-spacing: .05em; }
  .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .btn.won { color: #16A34A; border-color: #16A34A; }
  .btn.lost { color: var(--danger); border-color: var(--danger); }
  .btn.wonS { background: #16A34A; border-color: #16A34A; color: #fff; }
  .btn.lostS { background: var(--danger); border-color: var(--danger); color: #fff; }
  .badge.priv { border-style: solid; }
  /* stage bar: square boxes */
  .bar { display: flex; gap: 3px; margin: 4px 0 2px; }
  .bar div { flex: 1; border: .5px solid var(--line); padding: 4px 5px; font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; min-width: 0; }
  .bar div span { display: block; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 2px; }
  .bar .done { background: var(--wash); }
  .bar .now { background: var(--blue); color: #fff; border-color: var(--blue); }
  .bar .now span { color: rgba(255,255,255,.8); }
  .bar .next { color: var(--muted); border-style: dashed; }
  /* chevrons for C */
  .chev { display: flex; margin: 6px 0; }
  .chev div { flex: 1; background: var(--col); padding: 6px 4px 6px 12px; font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%, 8px 50%); margin-right: -4px; }
  .chev div:first-child { clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%); padding-left: 6px; }
  .chev div span { display: block; font-weight: 400; letter-spacing: 0; text-transform: none; margin-top: 1px; }
  .chev .done { background: rgba(43,0,255,.18); }
  .chev .now { background: var(--blue); color: #fff; }
  .strip { display: flex; margin: 8px 0; border: .5px solid var(--line-soft); }
  .strip div { flex: 1; padding: 5px 7px; font-family: var(--mono); font-size: 8px; letter-spacing: .2em; font-weight: 700; color: var(--muted); border-right: .5px solid var(--line-soft); text-transform: uppercase; }
  .strip div:last-child { border-right: 0; }
  .strip b { display: block; font-size: 12px; font-family: var(--sans); color: var(--ink); letter-spacing: 0; text-transform: none; margin-top: 2px; }
  .two { display: grid; grid-template-columns: 200px 1fr; gap: 14px; }
  .two .left { border-right: .5px solid var(--line-soft); padding-right: 12px; }
  .pp { font-size: 11px; margin-bottom: 4px; }
  .pp .btn { font-size: 7px; padding: 1px 4px; }
  .lostbox { border: .5px solid var(--line); background: var(--paper); padding: 12px; font-size: 11px; }
  .lostbox .in { border: .5px solid var(--line); background: var(--panel); padding: 6px 8px; font-family: var(--mono); font-size: 10px; margin: 4px 0 8px; }
  .lostbox .fl { font-family: var(--mono); font-size: 8px; letter-spacing: .25em; font-weight: 700; color: var(--muted); text-transform: uppercase; }
</style>
</head>
<body>
<header class="top">
  <div class="label"><span class="c">//</span> SF-95 · DEAL LIST VIEW AND DEAL PAGE</div>
  <h1>Which design for the deal page?</h1>
  <p>Each design shows the open deal "Demo Studios rebuild" in the Sales pipeline, then the box that opens on [ LOST ]. The deal list follows the People list in every design: filter row, table, preview drawer.</p>
</header>
<div class="grid">

    </div>
  </div>
  <div class="sub">After [ LOST ]: a box under the header</div>

  <figcaption><span class="label">Good for</span>Matches the People and Organisation pages: one way to read every record.</figcaption>
